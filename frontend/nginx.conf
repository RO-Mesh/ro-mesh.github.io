server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Charset & MIME ──────────────────────────────────────────────────────
    charset utf-8;

    # ── Gzip Compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/html
        text/plain
        text/xml;

    # ── Security Headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Cache-Control: Long-lived for hashed assets, no-store for HTML ──────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Service Worker must never be cached by the browser
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Manifest served with short TTL
    location = /manifest.json {
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Protocol Subdirectories SPA Routing ─────────────────────────────────
    location /meshcore {
        try_files $uri $uri/ /meshcore/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /meshtastic {
        try_files $uri $uri/ /meshtastic/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /reticulum {
        try_files $uri $uri/ /reticulum/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── SPA / PWA Routing: fallback to master index.html ────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── Error pages ─────────────────────────────────────────────────────────
    error_page 404 /index.html;

    # ── Access and error log locations ──────────────────────────────────────
    access_log /var/log/nginx/ro-mesh-access.log;
    error_log  /var/log/nginx/ro-mesh-error.log warn;
}
